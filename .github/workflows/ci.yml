name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt without a display, and no .pyc litter in the checkout.
  QT_QPA_PLATFORM: offscreen
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is what the application ships for; Linux runs the rest
          # of the suite, including what only runs there.
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The extension's scripts are syntax-checked and run in a fake browser
      # by the Python tests, which need node for that.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: System libraries for Qt and ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q -ra

  browser:
    name: Browser end to end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Playwright and Chromium
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$PWD/node_modules" >> "$GITHUB_ENV"
          echo "BOLTDOWN_CHROMIUM=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Benchmark and thresholds
        run: python -m pytest -q -ra tests/test_browser_e2e.py

      - name: Benchmark numbers
        if: always()
        run: python scripts/bench_browser.py --runs 5 --json bench.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-bench
          path: bench.json
          if-no-files-found: ignore

  extension:
    name: Extension packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the Chromium and Firefox packages
        run: |
          python -m pip install -e .
          python scripts/build_extension.py --out dist/extension

      # addons.mozilla.org runs the same linter on every upload.
      - name: Lint the Firefox package
        run: npx --yes web-ext@8 lint --source-dir dist/extension/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            dist/extension/*.zip
            dist/extension/*.xpi
