[project]
name = "boltdown"
version = "0.7.0"
description = "Multi-segment download manager for Windows (IDM-like)"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",   # socks extra = SOCKS5 proxy support
]

[project.optional-dependencies]
gui = [
    # 6.12.0 drops a reference to None on nearly every call that returns
    # nothing (setPen, save, drawControl...); on Python 3.11, where None is
    # not immortal, a long-running window runs it to zero and crashes. 3.12+
    # made None immortal, so it is only held back below that.
    # tests/test_qt_binding.py checks whatever version is installed.
    "PySide6-Essentials>=6.6,<6.12; python_version < '3.12'",
    "PySide6-Essentials>=6.6; python_version >= '3.12'",
]
media = [
    "yt-dlp>=2024.1.0",     # extracts direct URLs; we do the downloading
    "cryptography>=42",     # AES-128 decryption for encrypted HLS segments
]
torrent = [
    "libtorrent>=2.0",      # magnet links and .torrent files
]
packaging = [
    "pyinstaller>=6.0",     # scripts/build.py; Inno Setup is a separate install
    "libtorrent>=2.0",      # so the packaged app downloads torrents
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "PySide6-Essentials>=6.6,<6.12; python_version < '3.12'",  # see `gui`
    "PySide6-Essentials>=6.6; python_version >= '3.12'",
    "yt-dlp>=2024.1.0",
    "cryptography>=42",
    "libtorrent>=2.0",
]

[project.scripts]
boltdown = "app.cli:main"

[project.gui-scripts]
boltdown-gui = "app.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
