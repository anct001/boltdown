[project]
name = "boltdown"
version = "0.7.0"
description = "Multi-segment download manager for Windows (IDM-like)"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",   # socks extra = SOCKS5 proxy support
]

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.6",
]
media = [
    "yt-dlp>=2024.1.0",     # extracts direct URLs; we do the downloading
    "cryptography>=42",     # AES-128 decryption for encrypted HLS segments
]
packaging = [
    "pyinstaller>=6.0",     # scripts/build.py; Inno Setup is a separate install
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "PySide6-Essentials>=6.6",
    "yt-dlp>=2024.1.0",
    "cryptography>=42",
]

[project.scripts]
boltdown = "app.cli:main"

[project.gui-scripts]
boltdown-gui = "app.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
